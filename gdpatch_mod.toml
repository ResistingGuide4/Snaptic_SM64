id = "snaptic_smsixtyfour"

[meta]
name = "SNAPTIC SM64"
version = "0.1.1"
authors = ["InfoBroad"]
description = "Adds areas from Super Mario 64 as Custom Levels. You can access it by opening the dev console (ctrl+alt+d, f1) and typing 'level <LevelName>'"

[snapticbase]
dependencies = [
    "snapticbase@>=0.2.0"
]
custom_levels = [
    ["BOBOMB_BATTLEFIELD", "res://gdpatch/mod/snaptic_smsixtyfour/bobomb_battlefield.tscn"],
]
